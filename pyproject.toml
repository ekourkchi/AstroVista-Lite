[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "AstroVista"
version = "1.1.0rc1"
description = "AstroVista Lite: isophote fitting, source finding, masks and image arithmetic for astronomical images, simple enough for teaching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
maintainers = [{ name = "Ehsan Kourkchi", email = "ekourkchi@gmail.com" }]
keywords = ["astronomy", "surface photometry", "isophotes", "galaxies", "FITS", "SExtractor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PySide6>=6.11,!=6.12.0",  # 6.12.0 corrupts reference counts in threads (crashes Python 3.10, 3.11)
    "pyqtgraph>=0.13.3",
    "numpy>=1.24",
    "astropy>=5.3",
    "scipy>=1.10",
    "sep>=1.2",
    "elliprof>=0.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
astrovista = "astro_vista.app:main"
astro-vista = "astro_vista.app:main"
astrovista-lite = "astro_vista.app:main"

[project.urls]
Homepage = "https://ekourkchi.github.io/AstroVista-Lite/"
Documentation = "https://ekourkchi.github.io/AstroVista-Lite/"
Repository = "https://github.com/ekourkchi/AstroVista-Lite"
Issues = "https://github.com/ekourkchi/AstroVista-Lite/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astro_vista = ["data/*"]

[tool.black]
line-length = 100
