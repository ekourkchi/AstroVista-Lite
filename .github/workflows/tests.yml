# The tests on Linux and macOS, on every push and pull request:
#   - the test suite, against the package as pip installs it (not the source folder);
#   - on Linux, a whole session in the real window under X11 (xvfb, Qt's xcb plugin),
#     which needs the system libraries listed in the README;
#   - the wheel and sdist, built and checked as PyPI will see them.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 xvfb
      - name: Install AstroVista Lite
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: The test suite
        run: |
          cd tests   # the installed package is tested, not the source folder
          python -m pytest -q -o faulthandler_timeout=120 .
      - name: The command line
        run: |
          astrovista --version
          astro-vista --help
          python -m astro_vista --version
      - name: A whole session in the real window (X11)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/smoke.py smoke-output
      - name: A whole session (offscreen)
        if: runner.os != 'Linux'
        run: python tests/smoke.py smoke-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.python }}
          path: smoke-output
          if-no-files-found: ignore

  build:
    name: Build and check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: |
          python -m build --outdir dist .
          python -m twine check --strict dist/*
