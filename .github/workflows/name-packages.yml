# The other name on PyPI, astrovista-lite (it installs AstroVista), built and published
# when started by hand: Actions > name-packages > Run workflow.  The upload waits for
# approval in the protected "pypi" environment (Trusted Publishing: no stored secrets).
name: name-packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: |
          python -m build --outdir dist packaging/astrovista-lite
          python -m twine check --strict dist/*
      - name: It installs AstroVista
        run: |
          python -m pip install dist/*.whl
          python -c "import astro_vista; print('AstroVista', astro_vista.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: name-packages
          path: dist

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astrovista-lite/
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: name-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
